<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sunny Acres</title>
    <style>
        
        body {
            background-image: url('../images/background3.jpg');
            background-repeat: repeat;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        .container .logo {
            display: block;
            width: 520px;      
            height: auto;
            margin: 0 auto 15px auto;
        }

        .container a img {
            display: block;
            width: 450px;       
            height: auto;
            margin: 0 auto;
            border: 1px solid #ffffff; 
        }

        .container a:hover img {
            border-color: #339933;     
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Sunny Acres -->
        <img src="../images/sunny_logo.jpg" alt="Sunny Acres Logo" class="logo">

        <!-- Hình liên kết Siggie.jpg dẫn sang home.html -->
        <a href="home.html">
            <img src="../images/sunny_car.jpg" alt="Click to Enter Home">
        </a>
    </div>

</body>
</html>
